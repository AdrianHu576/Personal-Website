<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Hu CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Same content source as index.html -->
    <script src="content.js"></script>
    <style>
        :root { --ink: #1c1917; --muted: #57534e; --faint: #a8a29e; --accent: #ef4444; --rule: #e7e5e4; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: #e7e5e4;
            color: var(--ink);
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 11.5pt;
            line-height: 1.35;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .display { font-family: 'Space Grotesk', sans-serif; }

        .toolbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: center; gap: 10px; padding: 12px 16px;
            background: rgba(250, 250, 249, 0.92); backdrop-filter: blur(4px);
            border-bottom: 1px solid #d6d3d1;
        }
        .toolbar a, .toolbar button {
            font: 500 13px 'Space Grotesk', sans-serif; cursor: pointer; text-decoration: none;
            padding: 8px 14px; border-radius: 6px; border: 2px solid #d6d3d1; background: #fff; color: var(--ink);
        }
        .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .embed .toolbar { display: none; }

        .page {
            width: 8.5in; max-width: calc(100% - 32px); min-height: 11in;
            margin: 24px auto; padding: 0.6in 0.7in;
            background: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        .embed .page { margin: 16px auto; }

        header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
        h1 { font-size: 30pt; line-height: 1; margin: 0; font-weight: 700; }
        h1 .dot { color: var(--accent); font-size: 14pt; vertical-align: middle; margin-right: 6px; }
        .contact { text-align: right; font-size: 9pt; color: var(--muted); line-height: 1.6; }
        .contact a { color: var(--muted); text-decoration: none; }

        section { margin-top: 16px; }
        h2 {
            font-family: 'Space Grotesk', sans-serif; font-size: 9pt; font-weight: 700; letter-spacing: 0.15em;
            color: var(--accent); margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule);
        }
        .row { display: flex; justify-content: space-between; gap: 16px; }
        .row + .row, .item + .item { margin-top: 8px; }
        .title { font-weight: 700; }
        .meta { font-family: 'Space Grotesk', sans-serif; font-size: 8.5pt; color: var(--muted); white-space: nowrap; }
        .sub { color: var(--muted); }
        .venue { font-style: italic; color: var(--muted); }
        .badge {
            font-family: 'Space Grotesk', sans-serif; font-size: 7pt; font-weight: 600; letter-spacing: 0.08em;
            padding: 1px 6px; border-radius: 99px; background: #fef3c7; color: #92400e; margin-right: 6px; vertical-align: 1px;
        }
        .badge.progress { background: #e7e5e4; color: #44403c; }
        .tags { color: var(--muted); font-size: 10.5pt; }
        .courses { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; row-gap: 2px; }
        .courses div { display: flex; gap: 10px; }
        .courses .code { font-family: 'Space Grotesk', sans-serif; font-size: 8pt; color: var(--muted); width: 64px; flex-shrink: 0; padding-top: 2px; }
        .label { font-family: 'Space Grotesk', sans-serif; font-size: 8pt; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); margin: 8px 0 4px; }

        @page { size: letter; margin: 0; }
        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .page { margin: 0; box-shadow: none; width: auto; max-width: none; min-height: 0; }
            section { break-inside: avoid; }
        }
        @media (max-width: 640px) {
            .page { padding: 28px 22px; min-height: 0; }
            header { flex-direction: column; align-items: flex-start; }
            .contact { text-align: left; }
            .courses { grid-template-columns: 1fr; }
            .row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="index.html">← Back to site</a>
        <button class="primary" onclick="window.print()">Download PDF</button>
    </div>
    <main class="page" id="cv"></main>

<script>
(function () {
    const S = window.SITE;
    const params = new URLSearchParams(location.search);
    if (params.has('embed')) document.body.classList.add('embed');
    document.title = `${S.name} CV`;

    const authors = (list) => list.map(a => a === S.name ? `<strong>${a}</strong>` : a).join(', ');
    const pubs = (status) => S.publications.filter(p => p.status === status).map(p => `
        <div class="item">
            <div><span class="badge ${status}">${status === 'review' ? 'UNDER REVIEW' : 'IN PROGRESS'}</span><span class="title">${p.title}</span></div>
            <div>${authors(p.authors)}</div>
            <div class="venue">${p.venue}</div>
        </div>`).join('');
    const courseList = (list) => `<div class="courses">${list.map(([c, n]) => `<div><span class="code">${c}</span><span>${n}</span></div>`).join('')}</div>`;

    const links = [
        `<a href="mailto:${S.email}">${S.email}</a>`,
        S.location,
        S.links.website && `<a href="${S.links.website}">${S.links.website.replace(/^https?:\/\//, '')}</a>`,
        S.links.github && S.links.github !== '#' && `<a href="${S.links.github}">${S.links.github.replace(/^https?:\/\//, '')}</a>`,
    ].filter(Boolean).join('<br>');

    document.getElementById('cv').innerHTML = `
        <header>
            <div>
                <h1><span class="dot">●</span>${S.name}</h1>
                <div class="display sub" style="margin-top:6px;font-size:10pt">${S.role} · ${S.affiliation}</div>
            </div>
            <div class="contact display">${links}</div>
        </header>

        <section>
            <h2>EDUCATION</h2>
            ${S.education.map(e => `
                <div class="row">
                    <div><span class="title">${e.school}</span><br><span>${e.degree}</span>${e.details ? `<br><span class="sub">${e.details}</span>` : ''}</div>
                    <div class="meta">${e.dates}</div>
                </div>`).join('')}
        </section>

        <section>
            <h2>RESEARCH INTERESTS</h2>
            ${S.research.map(r => `
                <div class="item"><span class="title">${r.title}.</span> <span class="tags">${r.tags.join(', ')}</span></div>`).join('')}
        </section>

        <section>
            <h2>PUBLICATIONS</h2>
            ${pubs('review')}
            ${pubs('progress')}
        </section>

        <section>
            <h2>RELEVANT COURSEWORK</h2>
            <div class="label">IN PROGRESS · ${S.courses.currentTerm.toUpperCase()}</div>
            ${courseList(S.courses.current)}
            <div class="label">COMPLETED</div>
            ${courseList(S.courses.completed)}
        </section>
    `;

    if (params.has('print')) window.addEventListener('load', () => setTimeout(() => window.print(), 300));
})();
</script>
</body>
</html>
